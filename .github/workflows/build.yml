name: Android CI/CD
 
on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.jks
            echo "Release keystore decoded successfully."
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is required for tag builds."
              exit 1
            fi
            echo "RELEASE_KEYSTORE_BASE64 not configured, generating a fallback debug keystore."
            mkdir -p "$HOME/.config/.android"
            keytool -genkeypair \
              -keystore "$HOME/.config/.android/debug.keystore" \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

      - name: Build Debug & Release APKs
        env:
          RELEASE_STORE_FILE: release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare Artifacts & Checksums
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            GRADLE_VER=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            VERSION="v${GRADLE_VER:-1.0.0}"
          fi
          
          cp app/build/outputs/apk/release/app-release.apk "dist/0vl0ad3r-${VERSION}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/0vl0ad3r-${VERSION}-debug.apk"
          
          cd dist
          sha256sum "0vl0ad3r-${VERSION}-release.apk" "0vl0ad3r-${VERSION}-debug.apk" > sha256sums.txt
          cd ..

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 0vl0ad3r-APKs
          path: dist/*
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
